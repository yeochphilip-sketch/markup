version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Singapore'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'automerge'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      nextjs:
        patterns:
          - 'next'
          - 'eslint-config-next'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      stripe:
        patterns:
          - 'stripe'
          - '@stripe/*'
      supabase:
        patterns:
          - '@supabase/*'
      testing:
        patterns:
          - 'vitest'
          - '@testing-library/*'
          - 'jsdom'
