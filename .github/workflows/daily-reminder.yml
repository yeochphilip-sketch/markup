name: Daily Practice Reminder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  VERCEL_URL: 'https://markup-five.vercel.app'
  # Change VERCEL_URL if your production URL differs, or set it as a GitHub variable.

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call personalized reminder endpoint
        run: |
          RESPONSE=$(curl -s -X POST "$VERCEL_URL/api/email/daily-reminder" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -w "\n%{http_code}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Reminder endpoint returned error"
            exit 1
          fi
      - name: Log completion
        run: |
          echo "Reminder check completed at $(date --iso-8601=seconds)"
